name: 0.0.6 compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel-upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "build>=1" numpy google-crc32c pytest pytest-timeout
      - run: |
          python -m pip download --no-deps --only-binary=:all: okto-grafx==0.0.5 -d legacy
      - run: python -m build --wheel --outdir current
      - run: python tools/check_v006_upgrade.py --legacy-wheel legacy/okto_grafx-0.0.5-py3-none-any.whl --current-wheel current/okto_grafx-0.0.7-py3-none-any.whl
      - run: python -m pytest tests/api/test_system_history_native.py tests/api/test_system_history_operations.py tests/api/test_system_time_queries.py tests/api/test_fulltext_positions.py tests/api/test_posting_hash_memo.py --junitxml=v006.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v006-${{ matrix.os }}-${{ matrix.python }}
          path: v006.xml
