[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okto-grafx"
version = "0.0.1"
description = "Okto Grafx - embedded graph database for Python: multi-process safe, verifiable on disk, recoverable by construction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic License 2.0 + SaaS/Branding Addendum" }
authors = [{ name = "Okto Labs" }]
keywords = [
    "graph-database",
    "embedded-database",
    "mvcc",
    "write-ahead-log",
    "vector-search",
    "opencypher",
    "local-first",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    # Elastic License 2.0 is not an OSI-approved license, so there is deliberately no
    # "License :: OSI Approved" classifier here. The license field above and LICENSE
    # are the authority.
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The core is pure Python and the standard library is its only runtime requirement.
# Everything optional lives behind an extra below, and nothing is imported unless it
# was asked for by configuration.
dependencies = []

[project.urls]
Homepage = "https://github.com/OktoLabsAI/okto-grafx"
Documentation = "https://github.com/OktoLabsAI/okto-grafx#readme"
Repository = "https://github.com/OktoLabsAI/okto-grafx"
Issues = "https://github.com/OktoLabsAI/okto-grafx/issues"
Changelog = "https://github.com/OktoLabsAI/okto-grafx/blob/main/CHANGELOG.md"
License = "https://github.com/OktoLabsAI/okto-grafx/blob/main/LICENSE"

[project.optional-dependencies]
# RECOMMENDED for any real workload. Two accelerators behind ports the engine already
# declares, and neither one changes an answer:
#
#   google-crc32c - a native CRC-32C. `install_crc32c` replays an acceptance corpus
#     against the pure-Python reference and REFUSES a candidate that disagrees on any
#     input before installing it, so a database written by one build reads identically
#     in the other. Worth installing: on Linux the durable-commit multiple against the
#     reference engine falls from ~17x to ~5x with it, which is inside the ceiling
#     binding decision D5 sets.
#
#   numpy - accelerated vector math. Selected only by `vector_math="numpy"`, never
#     automatically: the pure and accelerated adapters agree to a stated tolerance
#     rather than exactly, so `auto` binds the pure oracle deliberately and the ranking
#     of a query does not depend on the machine it ran on.
accel = [
    "numpy>=1.24",
    "google-crc32c>=1.5",
]
# The side-by-side benchmark harness against the reference engine (the D5 measurements
# in docs/architecture/COMPONENTS.md). Not needed to run or test Okto Grafx.
bench = [
    "ladybug==0.16.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=8",
    "pytest-timeout",
]

[project.scripts]
oktografx = "okto_grafx.cli.entry:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["okto_grafx*"]

[tool.setuptools.package-data]
okto_grafx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A42: a per-test timeout, so a regression that loops forever is a red build rather than an
# indefinite stall. 60 s is roughly twice the slowest test measured on this tree (the wheel
# build, about 25 s) and far above the multi-process and race tests (under 5 s each), while
# still catching a genuine hang inside a minute. Anything legitimately slower carries its own
# @pytest.mark.timeout rather than raising this bound. The thread method is required: the
# signal method needs SIGALRM, which Windows does not have, and G4 makes both families equal.
addopts = "-q --strict-markers --timeout=60 --timeout-method=thread"
markers = [
    "platform_specific: test that exercises one operating-system family and has a declared counterpart (G4).",
    "slow: test whose runtime is dominated by volume rather than by logic.",
    "multiprocess: test that spawns more than one process against the same database.",
    "bench: benchmark or calibration test that requires the [bench] extra.",
    "pending: declared, registered debt; one of the three markers that can attribute a skip (A54).",
    "optional_dependency(module): the test declares the optional dependency it needs; the gate verifies that module really is absent (A54).",
]
